---
- name: Install runc
  ansible.builtin.apt:
    name:
      - runc
      - bash-completion
    state: present
    update_cache: true
  notify: Restart containerd

- name: Download containerd 2.4.0 binary archive
  ansible.builtin.get_url:
    url: "{{ deploy_containerd_download_url }}"
    dest: "/tmp/{{ deploy_containerd_tar }}"
    mode: "0644"

- name: Extract containerd binaries to /usr/local
  ansible.builtin.unarchive:
    src: "/tmp/{{ deploy_containerd_tar }}"
    dest: /usr/local
    remote_src: true
  notify: Restart containerd

- name: Create /etc/containerd
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create certs.d directory
  ansible.builtin.file:
    path: /etc/containerd/certs.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Deploy containerd config.toml
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  notify: Restart containerd

- name: Deploy containerd systemd service file
  ansible.builtin.template:
    src: containerd.service.j2
    dest: /etc/systemd/system/containerd.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart containerd

- name: Autocomplete ctr
  ansible.builtin.shell: |
    ctr completion bash > /etc/bash_completion.d/ctr
  args:
    creates: /etc/bash_completion.d/ctr

- name: Start containerd service
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true
