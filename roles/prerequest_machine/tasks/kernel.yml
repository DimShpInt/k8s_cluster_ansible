---
- name: Create kernel modules are configure to load at boot
  ansible.builtin.copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/containerd.conf
    mode: "0644"

- name: Load required kernel modules into runtime
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop: "{{ prerequest_machine_kernel_modules }}"

- name: Hold Kernel
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - "linux-image-{{ ansible_kernel }}"
    - "linux-headers-{{ ansible_kernel }}"
