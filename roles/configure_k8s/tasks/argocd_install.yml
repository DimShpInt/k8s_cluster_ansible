---
- name: Ensure directory for Helm values files exists
  ansible.builtin.file:
    path: "/home/ubuntu/helm/argo"
    state: directory
    mode: "0755"
    owner: ubuntu
    group: ubuntu

- name: Ensure Argo CD namespace exists
  ansible.builtin.shell: |
    set -o pipefail
    kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
  args:
    executable: /bin/bash
  register: argocd_namespace_result
  changed_when: "'created' in argocd_namespace_result.stdout or 'configured' in argocd_namespace_result.stdout"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Add Argo repository
  kubernetes.core.helm_repository:
    name: argo
    repo_url: "{{ configure_k8s_argo_repo_url }}"

- name: Template Argo values
  ansible.builtin.template:
    src: argo-values.yaml.j2
    dest: "/home/ubuntu/helm/argo/argo-values.yaml"
    mode: "0644"
    owner: ubuntu
    group: ubuntu

- name: Install Argo via Helm
  kubernetes.core.helm:
    state: present
    name: argo
    chart_ref: argo/argo-cd
    chart_version: "{{ configure_k8s_argo_version }}"
    namespace: argocd
    wait: true
    wait_timeout: "10m0s"
    kubeconfig: "/etc/kubernetes/admin.conf"
    update_repo_cache: true
    history_max: 3
    atomic: false
    values_files: "/home/ubuntu/helm/argo/argo-values.yaml"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Get Argo CD initial admin password
  ansible.builtin.shell: |
    set -o pipefail
    kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d
  args:
    executable: /bin/bash
  register: argocd_admin_password
  changed_when: false
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

- name: Display Argo CD access information
  ansible.builtin.debug:
    msg:
      - "UI: http://<node-ip>:{{ ingress_http_node_port }} (Host: {{ argocd_ingress_host }})"
      - "Для браузера добавьте в /etc/hosts: <node-ip> {{ argocd_ingress_host }}"
      - "Login: admin"
      - "Password: {{ argocd_admin_password.stdout }}"
